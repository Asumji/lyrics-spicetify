# Builds the extension and publishes a GitHub release whenever the version in package.json changes.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.version.outputs.new == 'true'
        run: npm install --no-audit --no-fund

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: npm run build

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "${COMMIT_MESSAGE}"
            echo
            echo "**Install:** download \`syncedLyrics.js\` below, copy it into your Spicetify \`Extensions\` folder, then run:"
            echo
            echo '```sh'
            echo 'spicetify config extensions syncedLyrics.js'
            echo 'spicetify apply'
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/syncedLyrics.js \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest
